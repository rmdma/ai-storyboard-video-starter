name: Beatport Labels Monitor

on:
  schedule:
    - cron: '0 8 * * *'   # каждый день в 10:00 GMT+2 (= 08:00 UTC)
  workflow_dispatch:        # ручной запуск из GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r beatport-agent/requirements.txt

      - name: Run Beatport agent
        env:
          BEATPORT_USERNAME: ${{ secrets.BEATPORT_USERNAME }}
          BEATPORT_PASSWORD: ${{ secrets.BEATPORT_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python beatport-agent/beatport_agent.py
